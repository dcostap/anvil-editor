name: Release Anvil

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            ca-certificates
            curl
            git
            unzip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python-pip

      - name: Install Meson
        run: pip install meson --break-system-packages

      - name: Build and test
        run: ./scripts/build-standalone-windows.sh

      - name: Add executable to release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: dist/anvil.exe
          generate_release_notes: true
